name: Expand generated plugin source

on:
  push:
    paths:
      - 'archive.part*'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand source snapshot when all parts are present
        run: |
          for i in 1 2 3 4 5 6; do
            if [ ! -f "archive.part$i" ]; then
              echo "Waiting for all archive parts."
              exit 0
            fi
          done
          cat archive.part1 archive.part2 archive.part3 archive.part4 archive.part5 archive.part6 | base64 -d > /tmp/gradebookdoctor.tar.xz
          rm -rf /tmp/gradebookdoctor
          tar -xJf /tmp/gradebookdoctor.tar.xz -C /tmp
          cp -a /tmp/gradebookdoctor/. .
          rm -f archive.part1 archive.part2 archive.part3 archive.part4 archive.part5 archive.part6
          rm -f .github/workflows/expand-source.yml
      - name: Commit exact source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Expand complete local_gradebookdoctor source"
          git push origin HEAD:main
